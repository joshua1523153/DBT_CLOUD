version: 2

models:
  - name: dim_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: kyc_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['VERIFIED', 'PENDING', 'REJECTED']

  - name: fct_transactions
    columns:
      - name: txn_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: amount
        data_tests: [not_null]